<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f6b45"><title>Guia Natural & Natura</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f2;color:#183526}.app{max-width:1120px;margin:auto}.hero{background:linear-gradient(135deg,#173d29,#43825a);color:#fff;padding:25px 20px 42px;border-radius:0 0 30px 30px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:#ffffff22;display:grid;place-items:center;font-size:25px}.brand strong{display:block;font-size:20px}.brand span{display:block;font-size:13px;opacity:.82;margin-top:3px}.heroText{max-width:760px;margin:38px auto 24px}.eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:bold;opacity:.78}.hero h1{font-size:38px;line-height:1.08;margin:10px 0}.heroText p{opacity:.9;line-height:1.5}.search{max-width:800px;margin:auto;background:#fff;border-radius:16px;padding:5px 16px;display:flex;align-items:center;box-shadow:0 8px 25px #0002}.search span{font-size:25px}.search input{border:0;outline:0;width:100%;padding:14px;font-size:16px}.section{padding:24px 20px}.head{display:flex;justify-content:space-between;align-items:center}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.chip,.tool{border:1px solid #d5ded6;background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.chip{border-radius:99px}.active{background:#2f6b45!important;color:#fff;border-color:#2f6b45!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px;margin-top:15px}.card{background:#fff;border:1px solid #e1e7e2;border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 4px 14px #19352508}.photo{width:100%;height:165px;object-fit:cover;border-radius:14px;background:#eef5ee}.card small{color:#718078}.card h3{margin:7px 0}.card p{color:#617068;line-height:1.45;min-height:44px}.foot{display:flex;justify-content:space-between;color:#2f6b45;font-weight:bold}.fav{border:0;background:none;font-size:24px;color:#2f6b45}.notice{margin:10px 20px 30px;background:#fff9e8;border:1px solid #eadfb8;border-radius:16px;padding:16px;color:#66562b;line-height:1.5}.detail{padding:20px}.back{border:0;background:#fff;border-radius:10px;padding:10px 14px}.detailTop{display:flex;justify-content:space-between}.detailHero{margin:25px 0;display:flex;gap:20px;align-items:center}.detailPhoto{width:150px;height:150px;object-fit:cover;border-radius:22px}.detailGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.info{background:#fff;padding:18px;border-radius:16px;border:1px solid #e1e7e2}.info h3{color:#2f6b45}.info p{line-height:1.5;color:#52625a}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef5ee;color:#2f6b45;font-size:12px;font-weight:bold}@media(max-width:600px){.hero h1{font-size:30px}.detailHero{align-items:flex-start;flex-direction:column}.detailPhoto{width:100%;height:210px}}</style></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>const cfg={apiKey:'AIzaSyAyKed3ooUWiee6nOdKEOeS5BOJZCOimVWo',authDomain:'natura-a22fe.firebaseapp.com',projectId:'natura-a22fe',storageBucket:'natura-a22fe.firebasestorage.app',messagingSenderId:'503067454388',appId:'1:503067454388:web:7a2c30d8fda4a2501260e1',measurementId:'G-GWS8F967P2'};firebase.initializeApp(cfg);const db=firebase.firestore();const sourceMS='Ministério da Saúde — ReniSUS / monografias';const sourceANVISA='Anvisa — Farmacopeia Brasileira / Formulário de Fitoterápicos';const photo=(term)=>'https://loremflickr.com/800/520/'+encodeURIComponent(term);const demo=[

{id:'raiz-alcacuZ',name:'Alcaçuz',scientificName:'Glycyrrhiza glabra',brand:'Planta medicinal',category:'Raízes',icon:'🌱',purpose:'Raiz utilizada em preparações tradicionais e fitoterápicas específicas.',usage:'Somente conforme preparação padronizada e orientação da fonte. Evitar automedicação.',ingestion:'Oral: somente quando a preparação for especificamente destinada ao uso oral.',useType:'Oral',warnings:'O uso em excesso ou prolongado pode causar efeitos importantes, inclusive alterações de pressão e eletrólitos. Requer atenção especial com medicamentos.',source:sourceANVISA,sourceUrl:'https://www.gov.br/anvisa/pt-br/assuntos/farmacopeia/formulario-fitoterapico',imageUrl:photo('licorice root')},

];let products=[...demo],cat='Todos',q='',favs=JSON.parse(localStorage.getItem('gnn_favorites')||'[]'),hist=JSON.parse(localStorage.getItem('gnn_history')||'[]');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');function save(){localStorage.setItem('gnn_favorites',JSON.stringify(favs));localStorage.setItem('gnn_history',JSON.stringify(hist))}function norm(p){return{id:p.id,name:p.name||'Produto',scientificName:p.scientificName||'',brand:p.brand||'Não informado',category:p.category||p.cat||'Naturais',icon:p.icon||'🌿',purpose:p.purpose||p.description||'Informação não cadastrada.',usage:p.usage||p.use||'Consultar o rótulo.',ingestion:p.ingestion||p.ing||'Consultar a indicação do fabricante.',useType:p.useType||'',adverseReactions:p.adverseReactions||p.adverse||'Não informado.',warnings:p.warnings||p.warning||'Confira o rótulo.',imageUrl:p.imageUrl||'',source:p.source||'',sourceUrl:p.sourceUrl||''}}function list(){return products.filter(p=>(cat==='Todos'||p.category===cat)&&(`${p.name} ${p.scientificName||''} ${p.brand} ${p.category}`.toLowerCase().includes(q.toLowerCase())))}function toggle(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();render()}function card(p){return `<article class="card" onclick="detail('${esc(p.id)}')">${p.imageUrl?`<img class="photo" src="${esc(p.imageUrl)}" loading="lazy" onerror="this.style.display='none'">`:''}<small>${esc(p.brand)} · ${esc(p.category)}</small><h3>${esc(p.name)}</h3><small><i>${esc(p.scientificName||'Nome científico não cadastrado')}</i></small><p>${esc(p.purpose)}</p><div class="foot"><span>${esc(p.useType||'Consultar')} · Ver detalhes →</span><button class="fav" onclick="event.stopPropagation();toggle('${esc(p.id)}')">${favs.includes(p.id)?'★':'☆'}</button></div></article>`}function render(){let a=list();app.innerHTML=`<div class="app"><header class="hero"><div class="brand"><div class="logo">🌿</div><div><strong>Guia Natural & Natura</strong><span>Informação simples para escolher melhor</span></div></div><div class="heroText"><p class="eyebrow">CATÁLOGO DE RAÍZES E PLANTAS</p><h1>Encontre informações sobre plantas e produtos naturais.</h1><p>Primeiro lote publicado com nome popular, nome científico, fotos, uso e fontes.</p></div><div class="search"><span>⌕</span><input id="search" value="${esc(q)}" placeholder="Buscar planta, nome científico ou categoria..."></div></header><section class="section"><div class="head"><h2>Categorias</h2><span>${a.length} itens</span></div><div class="chips">${['Todos','Raízes','Raízes e rizomas','Bulbos e raízes','Flores e ervas','Ervas','Ervas e sementes','Flores','Uso externo'].map(x=>`<button class="chip ${cat===x?'active':''}" onclick="cat='${x}';render()">${x}</button>`).join('')}</div></section><section class="section"><div class="head"><h2>Primeiro lote</h2><span>Publicado</span></div><div class="grid">${a.map(card).join('')}</div>${!a.length?'<p>Nenhum item encontrado.</p>':''}</section><div class="notice">ⓘ <strong>Informação importante:</strong> este catálogo é informativo. As monografias do Ministério da Saúde sistematizam informações sobre plantas, mas isso não significa que eficácia e segurança estejam necessariamente comprovadas para todas as espécies. Cosméticos e produtos de uso externo não devem ser ingeridos. Consulte sempre a fonte oficial e um profissional qualificado.</div><footer style="text-align:center;padding:22px;color:#7a867f;font-size:12px">Guia Natural & Natura · acesso público sem login</footer></div>`;search.oninput=e=>{q=e.target.value;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(q.length,q.length)}}function detail(id){let p=products.find(x=>String(x.id)===String(id));if(!p)return;if(!hist.includes(id)){hist=[id,...hist].slice(0,12);save()}app.innerHTML=`<div class="app detail"><div class="detailTop"><button class="back" onclick="render()">← Voltar</button><button class="tool" onclick="toggle('${esc(p.id)}')">${favs.includes(p.id)?'★ Favorito':'☆ Favoritar'}</button></div><div class="detailHero">${p.imageUrl?`<img class="detailPhoto" src="${esc(p.imageUrl)}">`:''}<div><span class="badge">${esc(p.brand)} · ${esc(p.category)}</span><h1>${esc(p.name)}</h1><p><i>${esc(p.scientificName||'Nome científico não informado')}</i></p><p>${esc(p.purpose)}</p></div></div><div class="detailGrid"><div class="info"><h3>Categoria</h3><p>${esc(p.category)}</p></div><div class="info"><h3>Uso</h3><p>${esc(p.useType||'Não informado')}</p></div><div class="info"><h3>Modo de uso</h3><p>${esc(p.usage)}</p></div><div class="info"><h3>Ingestão</h3><p>${esc(p.ingestion)}</p></div><div class="info"><h3>Alertas</h3><p>${esc(p.warnings)}</p></div></div>${p.source?`<p><small>Fonte: ${esc(p.source)}</small>${p.sourceUrl?`<br><a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">Consultar fonte oficial</a>`:''}</p>`:''}<div class="notice">⚠ As informações são gerais e não substituem avaliação médica, farmacêutica ou nutricional. Não use plantas medicinais para substituir tratamento prescrito.</div></div>`}render();db.collection('products').where('status','==','published').get().then(s=>{const cloud=s.docs.map(d=>norm({id:d.id,...d.data()}));if(cloud.length){products=[...demo,...cloud];render()}}).catch(e=>console.warn('Firestore indisponível; usando o lote local.',e));</script></body></html>
