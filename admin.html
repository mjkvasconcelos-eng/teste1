<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#2f6b45"><title>Admin · Guia Natural & Natura</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f3;color:#183526}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:#2f6b45;color:#fff;display:grid;place-items:center;font-size:23px}.brand strong{display:block;font-size:19px}.brand small{color:#718078}.panel{background:#fff;border:1px solid #dfe7e1;border-radius:18px;padding:20px;box-shadow:0 5px 20px #173d2910}.login{max-width:440px;margin:8vh auto}.h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d6dfd8;border-radius:10px;padding:11px;font:inherit;background:#fff}.field textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid #cfdad1;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:#2f6b45;color:#fff;border-color:#2f6b45}.danger{background:#fff0f0;color:#a52d2d;border-color:#efcaca}.muted{color:#6e7c74;font-size:13px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input{flex:1;min-width:210px;border:1px solid #d6dfd8;border-radius:10px;padding:11px}.product{padding:14px;border:1px solid #e0e7e1;border-radius:13px;margin-bottom:9px;cursor:pointer}.product:hover{background:#f8fbf8}.product strong{display:block}.badge{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:99px;background:#edf5ee;color:#2f6b45;font-size:11px}.status{font-size:12px;margin-left:6px}.notice{margin-top:15px;background:#fff9e8;border:1px solid #eadfb8;border-radius:12px;padding:12px;color:#66562b;font-size:13px;line-height:1.45}.ok{color:#267142}.error{color:#a52d2d}.check{display:flex;gap:8px;align-items:center;margin:12px 0}.check input{width:auto}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:'AIzaSyAyKed3ooUWiee6nOdOKeS5BOJZCOimVWo',authDomain:'natura-a22fe.firebaseapp.com',projectId:'natura-a22fe',storageBucket:'natura-a22fe.firebasestorage.app',messagingSenderId:'503067454388',appId:'1:503067454388:web:7a2c30d8fda4a2501260e1',measurementId:'G-GWS8F967P2'};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let current=null,products=[],editingId=null;
const cats=['Naturais','Suplementos','Chás e ervas','Natura','Cuidados pessoais'];
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function login(){root.innerHTML=`<div class="panel login"><div class="brand"><div class="logo">🌿</div><div><strong>Guia Natural & Natura</strong><small>Painel administrativo</small></div></div><h2 class="h2">Entrar</h2><p class="muted">Acesso somente para usuários autorizados.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn primary" onclick="doLogin()">Entrar</button></div><p id="msg" class="error"></p><div class="notice">A criação de contas deve ser feita pelo Firebase Console. Depois, o usuário precisa ter um documento em <b>users/{UID}</b> com <b>role: admin</b> ou <b>role: editor</b>.</div></div>`}
async function doLogin(){msg.textContent='Entrando...';try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value); }catch(e){msg.textContent='Não foi possível entrar: '+(e.code||e.message)}}
function app(){root.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><div class="logo">🌿</div><div><strong>Guia Natural & Natura</strong><small>Cadastro de produtos</small></div></div><div><span class="muted" id="who"></span> <button class="btn" onclick="auth.signOut()">Sair</button></div></div><div class="grid"><section class="panel"><h2 id="formTitle">Novo produto</h2><div class="row"><div class="field"><label>Nome *</label><input id="name"></div><div class="field"><label>Marca</label><input id="brand"></div></div><div class="row"><div class="field"><label>Categoria *</label><select id="category">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="status"><option value="published">Publicado</option><option value="draft">Rascunho</option></select></div></div><div class="field"><label>Descrição</label><textarea id="description"></textarea></div><div class="field"><label>Para que serve</label><textarea id="purpose"></textarea></div><div class="field"><label>Modo de uso</label><textarea id="usage"></textarea></div><div class="row"><div class="field"><label>Ingestão</label><textarea id="ingestion"></textarea></div><div class="field"><label>Ingredientes</label><textarea id="ingredients" placeholder="Separe por vírgulas"></textarea></div></div><div class="row"><div class="field"><label>Contraindicações</label><textarea id="contraindications"></textarea></div><div class="field"><label>Possíveis reações</label><textarea id="adverseReactions"></textarea></div></div><div class="row"><div class="field"><label>Público-alvo</label><textarea id="targetAudience"></textarea></div><div class="field"><label>Alertas</label><textarea id="warnings"></textarea></div></div><div class="row"><div class="field"><label>URL da imagem</label><input id="imageUrl" type="url"></div><div class="field"><label>Fonte</label><input id="source"></div></div><div class="row"><div class="field"><label>URL da fonte</label><input id="sourceUrl" type="url"></div><div class="field"><label>Ícone/emoji</label><input id="icon" value="🌿"></div></div><label class="check"><input id="ingestible" type="checkbox"> Produto destinado à ingestão oral</label><div class="actions"><button class="btn primary" onclick="saveProduct()">Salvar produto</button><button class="btn" onclick="clearForm()">Limpar</button><button id="deleteBtn" class="btn danger hidden" onclick="deleteProduct()">Excluir</button></div><p id="formMsg" class="muted"></p></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Pesquisar produtos..." oninput="drawList()"><button class="btn" onclick="clearForm()">+ Novo</button></div><div id="list"></div></section></div></div>`;who.textContent=current.email||'';listenProducts()}
function listenProducts(){db.collection('products').orderBy('name').onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));drawList()},e=>{list.innerHTML=`<p class="error">Erro ao consultar produtos: ${esc(e.message)}</p>`})}
function drawList(){let q=(search?.value||'').toLowerCase();let arr=products.filter(p=>`${p.name} ${p.brand} ${p.category}`.toLowerCase().includes(q));list.innerHTML=arr.length?arr.map(p=>`<div class="product" onclick="editProduct('${p.id}')"><strong>${esc(p.name)}</strong><span class="muted">${esc(p.brand||'')} · ${esc(p.category||'')}</span><br><span class="badge">${p.status==='published'?'Publicado':'Rascunho'}</span><span class="status">${p.ingestible?'🍽️ ingestível':'🔒 não ingerir'}</span></div>`).join(''):'<p class="muted">Nenhum produto cadastrado.</p>'}
const fields=['name','brand','category','status','description','purpose','usage','ingestion','ingredients','contraindications','adverseReactions','targetAudience','warnings','imageUrl','source','sourceUrl','icon'];
function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;editingId=id;formTitle.textContent='Editar produto';fields.forEach(k=>{let el=document.getElementById(k);if(el)el.value=p[k]??''});ingestible.checked=!!p.ingestible;deleteBtn.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){editingId=null;formTitle.textContent='Novo produto';fields.forEach(k=>{let el=document.getElementById(k);if(el)el.value=k==='icon'?'🌿':''});status.value='published';category.value='Naturais';ingestible.checked=false;deleteBtn.classList.add('hidden');formMsg.textContent=''}
function payload(){let p={};fields.forEach(k=>p[k]=document.getElementById(k).value.trim());p.ingredients=p.ingredients?p.ingredients.split(',').map(x=>x.trim()).filter(Boolean):[];p.ingestible=ingestible.checked;p.updatedAt=firebase.firestore.FieldValue.serverTimestamp();p.updatedBy=current.uid;return p}
async function saveProduct(){if(!name.value.trim()){formMsg.textContent='Informe o nome do produto.';formMsg.className='error';return}formMsg.textContent='Salvando...';try{let p=payload();if(editingId)await db.collection('products').doc(editingId).set(p,{merge:true});else{p.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('products').add(p)}formMsg.textContent='Produto salvo com sucesso.';formMsg.className='ok';if(!editingId)clearForm()}catch(e){formMsg.textContent='Erro: '+e.message;formMsg.className='error'}}
async function deleteProduct(){if(!editingId||!confirm('Excluir este produto?'))return;try{await db.collection('products').doc(editingId).delete();clearForm();formMsg.textContent='Produto excluído.';formMsg.className='ok'}catch(e){formMsg.textContent='Erro: '+e.message;formMsg.className='error'}}
auth.onAuthStateChanged(async user=>{current=user;if(!user){login();return}try{let u=await db.collection('users').doc(user.uid).get();if(!u.exists||!['admin','editor'].includes(u.data().role)){await auth.signOut();root.innerHTML='<div class="panel login"><h2>Acesso não autorizado</h2><p>Seu usuário não possui função <b>admin</b> ou <b>editor</b>.</p></div>';return}app()}catch(e){root.innerHTML='<div class="panel login"><h2>Erro de autorização</h2><p class="error">'+esc(e.message)+'</p></div>'}});
</script>
</body></html>
