<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2f6b45">
<title>Guia Natural & Natura</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f2;color:#183526}.app{max-width:1100px;margin:auto}.hero{background:linear-gradient(135deg,#173d29,#3f8057);color:#fff;padding:28px 20px 42px;border-radius:0 0 28px 28px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:#fff2;display:grid;place-items:center;font-size:25px}.brand strong{display:block;font-size:20px}.brand span{display:block;font-size:13px;opacity:.8;margin-top:3px}.heroText{max-width:700px;margin:42px auto 24px}.eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:bold;opacity:.8}.hero h1{font-size:38px;line-height:1.08;margin:10px 0}.heroText>p:last-child{opacity:.9}.search{max-width:760px;margin:auto;background:#fff;border-radius:15px;padding:5px 16px;display:flex;align-items:center;box-shadow:0 8px 25px #0002}.search span{font-size:25px;color:#557}.search input{border:0;outline:0;width:100%;padding:14px;font-size:16px}.section{padding:26px 20px}.sectionHead{display:flex;justify-content:space-between;align-items:center}.sectionHead h2{margin:0}.sectionHead span{font-size:13px;color:#708078}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.chip{border:1px solid #d5ded6;background:#fff;border-radius:99px;padding:10px 15px;cursor:pointer}.chip.active{background:#2f6b45;color:#fff;border-color:#2f6b45}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:15px}.card{background:#fff;border:1px solid #e1e7e2;border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 4px 14px #19352508}.cardIcon{font-size:35px;background:#eef5ee;width:58px;height:58px;border-radius:15px;display:grid;place-items:center}.cardBody small{color:#718078}.card h3{margin:7px 0}.card p{color:#617068;line-height:1.45}.cardFooter{display:flex;justify-content:space-between;align-items:center;color:#2f6b45;font-weight:bold}.fav{border:0;background:none;font-size:25px;cursor:pointer}.notice{margin:10px 20px 30px;background:#fff9e8;border:1px solid #eadfb8;border-radius:16px;padding:16px;display:flex;gap:12px;color:#66562b;line-height:1.5}.empty{padding:30px;text-align:center;color:#69766f}footer{text-align:center;padding:20px;color:#7a867f;font-size:12px}.detail{padding:20px}.back{border:0;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.detailHero{margin:25px 0;display:flex;gap:20px;align-items:center}.bigIcon{font-size:55px;background:#e9f3e9;padding:20px;border-radius:22px}.detailGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.info{background:#fff;padding:18px;border-radius:16px;border:1px solid #e1e7e2}.info h3{margin-top:0;color:#2f6b45}.info p{line-height:1.5;color:#52625a}@media(max-width:600px){.hero h1{font-size:30px}.hero{padding-top:20px}.detailHero{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const products=[
{name:'Chá de camomila',brand:'Natural',cat:'Chás e ervas',icon:'🌼',purpose:'Tradicionalmente usado como bebida quente e relaxante.',use:'Preparar conforme as orientações da embalagem ou da fonte consultada.',ing:'Produto destinado ao preparo de bebida.',adverse:'Pode causar reações em pessoas sensíveis à camomila ou a plantas da mesma família.',warning:'Confirme a origem e as orientações do produto antes do uso.'},
{name:'Óleo essencial de lavanda',brand:'Natural',cat:'Naturais',icon:'🌿',purpose:'Produto aromático usado em aplicações externas e aromáticas, conforme a apresentação.',use:'Seguir rigorosamente o rótulo.',ing:'Não ingerir se a apresentação não for destinada ao uso oral.',adverse:'Pode causar irritação ou sensibilização em algumas pessoas.',warning:'Óleos essenciais não devem ser ingeridos sem indicação específica do fabricante.'},
{name:'Hidratante corporal',brand:'Natura',cat:'Natura',icon:'🧴',purpose:'Cuidados e hidratação da pele.',use:'Aplicar sobre a pele conforme as instruções da embalagem.',ing:'Não ingerir.',adverse:'Pode ocorrer irritação ou sensibilidade individual.',warning:'Uso externo. Evite contato com os olhos.'},
{name:'Shampoo de cuidados capilares',brand:'Natura',cat:'Cuidados pessoais',icon:'🫧',purpose:'Higiene e cuidados dos cabelos.',use:'Aplicar nos cabelos e couro cabeludo conforme o rótulo.',ing:'Não ingerir.',adverse:'Pode causar irritação em pessoas sensíveis aos ingredientes.',warning:'Uso externo. Em caso de irritação, suspenda o uso.'},
{name:'Suplemento vitamínico',brand:'Exemplo',cat:'Suplementos',icon:'💊',purpose:'Complementação da alimentação quando o produto é autorizado para essa finalidade.',use:'Seguir exclusivamente a quantidade indicada no rótulo.',ing:'Somente se identificado como suplemento alimentar destinado ao uso oral.',adverse:'Reações variam conforme os ingredientes e a pessoa.',warning:'Não é medicamento. Não exceda a recomendação do rótulo.'}
];
let category='Todos',query='';
function render(){let list=products.filter(p=>(category==='Todos'||p.cat===category)&&(`${p.name} ${p.brand} ${p.cat}`.toLowerCase().includes(query.toLowerCase())));document.getElementById('app').innerHTML=`<div class="app"><header class="hero"><div class="brand"><div class="logo">🌿</div><div><strong>Guia Natural & Natura</strong><span>Informação simples para escolher melhor</span></div></div><div class="heroText"><p class="eyebrow">GUIA DE PRODUTOS</p><h1>Encontre informações sobre o que você procura.</h1><p>Pesquise produtos naturais, suplementos e itens de cuidados pessoais em um só lugar.</p></div><div class="search"><span>⌕</span><input id="q" value="${query.replaceAll('"','&quot;')}" placeholder="Buscar produto, marca ou categoria..."></div></header><main><section class="section"><div class="sectionHead"><h2>Categorias</h2><span>${list.length} produtos</span></div><div class="chips">${['Todos','Naturais','Suplementos','Chás e ervas','Natura','Cuidados pessoais'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div></section><section class="section"><div class="sectionHead"><h2>Produtos</h2><span>Atualização informativa</span></div><div class="grid">${list.map((p,i)=>`<article class="card" onclick="detail(${products.indexOf(p)})"><div class="cardIcon">${p.icon}</div><div class="cardBody"><small>${p.brand} · ${p.cat}</small><h3>${p.name}</h3><p>${p.purpose}</p><div class="cardFooter"><span>Ver detalhes →</span><button class="fav" onclick="event.stopPropagation();alert('Favorito salvo nesta versão.')">☆</button></div></div></article>`).join('')}</div>${!list.length?'<div class="empty">Nenhum produto encontrado.</div>':''}</section><section class="notice"><div>ⓘ</div><div><strong>Informação importante</strong><br>Este aplicativo é informativo. Produtos naturais não são automaticamente seguros e cosméticos não devem ser ingeridos. Sempre confira o rótulo e a fonte oficial do produto.</div></section></main><footer>Guia Natural & Natura · Versão inicial</footer></div>`;document.getElementById('q').oninput=e=>{query=e.target.value;render();document.getElementById('q').focus();document.getElementById('q').setSelectionRange(query.length,query.length)}}
function setCat(c){category=c;render()}function detail(i){let p=products[i];document.getElementById('app').innerHTML=`<div class="app detail"><button class="back" onclick="render()">← Voltar</button><div class="detailHero"><div class="bigIcon">${p.icon}</div><div><p class="eyebrow">${p.brand} · ${p.cat}</p><h1>${p.name}</h1><p>${p.purpose}</p></div></div><div class="detailGrid"><div class="info"><h3>Para que serve</h3><p>${p.purpose}</p></div><div class="info"><h3>Modo de uso</h3><p>${p.use}</p></div><div class="info"><h3>Ingestão</h3><p>${p.ing}</p></div><div class="info"><h3>Possíveis reações</h3><p>${p.adverse}</p></div><div class="info"><h3>Atenção</h3><p>${p.warning}</p></div></div><section class="notice" style="margin-left:0;margin-right:0;margin-top:25px"><div>⚠</div><div><strong>Consulte o rótulo e a fonte oficial.</strong><br>As informações são gerais e não substituem as orientações específicas do fabricante ou de um profissional habilitado.</div></section></div>`}render();
</script>
</body>
</html>
