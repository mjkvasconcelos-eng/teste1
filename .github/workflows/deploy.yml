name: Deploy Guia Natural & Natura

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PUBLIC_PAGE: firebase-public-v2.html
  CATALOG_2: catalog/lote-02-plantas-medicinais.json
  ROBOT_CATALOG: catalog/robot-catalog.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Prepare public page
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PUBLIC_PAGE"
          test -f "$CATALOG_2"
          test -f "$ROBOT_CATALOG"
          mkdir -p dist
          cp "$PUBLIC_PAGE" dist/index.html

      - name: Merge all catalogs into public page
        shell: python
        run: |
          import json
          from pathlib import Path

          page = Path('dist/index.html')
          html = page.read_text(encoding='utf-8')

          def read_items(path):
              data = json.loads(Path(path).read_text(encoding='utf-8'))
              items = data.get('items', [])
              if not isinstance(items, list):
                  raise SystemExit(f'O campo items de {path} deve ser uma lista.')
              return items

          lote2 = read_items('catalog/lote-02-plantas-medicinais.json')
          robot = read_items('catalog/robot-catalog.json')

          marker = '];let products=[...demo]'
          if marker not in html:
              raise SystemExit('Marcador do catálogo demo não encontrado em firebase-public-v2.html')

          extra2 = json.dumps(lote2, ensure_ascii=False, separators=(',', ':'))
          extrar = json.dumps(robot, ensure_ascii=False, separators=(',', ':'))
          replacement = '];const lote2=' + extra2 + ';const loteRobot=' + extrar + ';let products=[...demo,...lote2,...loteRobot]'
          html = html.replace(marker, replacement, 1)
          page.write_text(html, encoding='utf-8')

          expected = lote2 + robot
          missing = [str(item.get('id')) for item in expected if str(item.get('id')) not in html]
          if missing:
              raise SystemExit(f'Itens ausentes na página publicada: {missing[:20]}')

          print(f'Lote 2 incorporado: {len(lote2)} itens')
          print(f'Catálogo do robô incorporado: {len(robot)} itens')
          print(f'Total de itens anexados aos dados demo: {len(expected)}')

      - name: Validate public page
        shell: python
        run: |
          from pathlib import Path
          html = Path('dist/index.html').read_text(encoding='utf-8')
          required = ['Guia Natural & Natura', 'const lote2=', 'const loteRobot=', '...demo,...lote2,...loteRobot']
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit(f'Validação da página pública falhou: {missing}')
          print('Página pública sem login validada com os três catálogos.')

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
