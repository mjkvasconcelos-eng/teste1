name: Deploy Guia Natural & Natura

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Use catalog public page
        run: cp firebase-public-v2.html dist/index.html

      - name: Inject catalog seed into public page
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          page = Path('dist/index.html')
          catalog = json.loads(Path('catalog/lote-02-plantas-medicinais.json').read_text(encoding='utf-8'))
          html = page.read_text(encoding='utf-8')
          marker = '];let products='
          if marker not in html:
              raise SystemExit('Marcador do catálogo não encontrado')
          extra = json.dumps(catalog['items'], ensure_ascii=False, separators=(',', ':'))
          html = html.replace(marker, ']' + '+' + extra + ';let products=', 1)
          page.write_text(html, encoding='utf-8')
          print('Segundo lote injetado:', len(catalog['items']))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4