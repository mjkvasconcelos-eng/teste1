<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f6b45"><title>Guia Natural & Natura</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7f2;color:#183526}.wrap{max-width:1120px;margin:auto}.hero{background:linear-gradient(135deg,#173d29,#43825a);color:white;padding:24px 20px 38px;border-radius:0 0 28px 28px}.brand{font-weight:bold;font-size:21px}.hero h1{font-size:38px;margin:34px 0 10px}.hero p{opacity:.9;line-height:1.5}.search{background:white;border-radius:15px;padding:4px 14px;margin:20px auto 0;max-width:800px}.search input{width:100%;border:0;outline:0;padding:14px;font-size:16px}.section{padding:22px 20px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip,.back,.fav{border:1px solid #d5ded6;background:white;border-radius:12px;padding:10px 14px;cursor:pointer}.active{background:#2f6b45;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.card,.info{background:white;border:1px solid #e1e7e2;border-radius:17px;padding:16px;box-shadow:0 4px 14px #1935250b}.card{cursor:pointer}.photo{width:100%;height:160px;object-fit:cover;border-radius:13px;background:#edf4ed}.card h3{margin:8px 0}.muted{color:#6b7971;font-size:13px}.badge{display:inline-block;background:#eef5ee;color:#2f6b45;border-radius:20px;padding:5px 9px;font-size:12px;margin:3px 3px 3px 0}.notice{margin:20px;background:#fff9e8;border:1px solid #eadfb8;border-radius:15px;padding:16px;line-height:1.5}.detail{padding:20px}.detailTop{display:flex;justify-content:space-between}.detailHero{display:flex;gap:20px;align-items:center;margin:24px 0}.detailPhoto{width:170px;height:170px;object-fit:cover;border-radius:22px;background:#edf4ed}.detailGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.info h3{color:#2f6b45}.info p{line-height:1.5;color:#53625a}@media(max-width:600px){.hero h1{font-size:30px}.detailHero{flex-direction:column;align-items:flex-start}}</style></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>firebase.initializeApp({apiKey:'AIzaSyAyKed3ooUWiee6nOdKEOeS5BOJZCOimVWo',authDomain:'natura-a22fe.firebaseapp.com',projectId:'natura-a22fe',storageBucket:'natura-a22fe.firebasestorage.app',messagingSenderId:'503067454388',appId:'1:503067454388:web:7a2c30d8fda4a2501260e1'});const db=firebase.firestore();const demo=[{id:'d1',name:'Gengibre',popularName:'Gengibre',scientificName:'Zingiber officinale',category:'Raízes',usageType:'Uso oral e externo',purpose:'Cadastro demonstrativo; consultar fonte oficial.',usage:'Consultar fonte e rótulo.',alerts:'Não publicar orientação específica sem fonte oficial.',source:'Anvisa / Farmacopeia Brasileira',sourceUrl:'https://www.gov.br/anvisa/pt-br/assuntos/farmacopeia/farmacopeia-brasileira',imageUrl:''},{id:'d2',name:'Cúrcuma',popularName:'Cúrcuma / açafrão-da-terra',scientificName:'Curcuma longa',category:'Raízes',usageType:'Uso oral e externo',purpose:'Cadastro demonstrativo; consultar fonte oficial.',usage:'Consultar fonte e rótulo.',alerts:'Não publicar orientação específica sem fonte oficial.',source:'Ministério da Saúde / ReniSUS',sourceUrl:'https://www.gov.br/saude/pt-br/composicao/sectics/plantas-medicinais-e-fitoterapicos/plantas-medicinais-e-fitoterapicos-no-sus/monografias',imageUrl:''},{id:'d3',name:'Alho',popularName:'Alho',scientificName:'Allium sativum',category:'Plantas medicinais',usageType:'Uso oral e externo',purpose:'Cadastro demonstrativo; consultar fonte oficial.',usage:'Consultar fonte e rótulo.',alerts:'Não publicar orientação específica sem fonte oficial.',source:'Ministério da Saúde / ReniSUS',sourceUrl:'https://www.gov.br/saude/pt-br/composicao/sectics/plantas-medicinais-e-fitoterapicos/plantas-medicinais-e-fitoterapicos-no-sus/monografias',imageUrl:''},{id:'d4',name:'Hidratante corporal',popularName:'Hidratante corporal',scientificName:'',category:'Natura',usageType:'Uso externo',purpose:'Produto cosmético para cuidados da pele.',usage:'Seguir a embalagem.',alerts:'Não ingerir. Uso externo.',source:'Fabricante / Natura',sourceUrl:'https://www.natura.com.br/',imageUrl:''}];let products=[...demo],cat='Todos',q='',favs=JSON.parse(localStorage.getItem('gnn_favorites')||'[]');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const categories=['Todos','Raízes','Plantas medicinais','Ervas','Chás','Suplementos','Natura','Cuidados pessoais','Cosméticos','Óleos e extratos'];function filtered(){return products.filter(p=>(cat==='Todos'||p.category===cat)&&(`${p.name} ${p.popularName} ${p.scientificName} ${p.category} ${p.brand||''}`.toLowerCase().includes(q.toLowerCase())))}function toggle(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('gnn_favorites',JSON.stringify(favs));render()}function card(p){return `<article class="card" onclick="detail('${esc(p.id)}')">${p.imageUrl?`<img class="photo" src="${esc(p.imageUrl)}">`:`<div class="photo" style="display:grid;place-items:center;font-size:55px">🌿</div>`}<span class="badge">${esc(p.category)}</span><span class="badge">${esc(p.usageType)}</span><h3>${esc(p.name)}</h3>${p.scientificName?`<div class="muted"><i>${esc(p.scientificName)}</i></div>`:''}<p>${esc(p.purpose||'Informações em cadastro')}</p><button class="fav" onclick="event.stopPropagation();toggle('${esc(p.id)}')">${favs.includes(p.id)?'★ Favorito':'☆ Favoritar'}</button></article>`}function render(){const a=filtered();app.innerHTML=`<div class="wrap"><header class="hero"><div class="brand">🌿 Guia Natural & Natura</div><h1>Catálogo de raízes, plantas medicinais e produtos</h1><p>Consulte nome popular, nome científico, categoria, tipo de uso, modo de uso, alertas e fonte.</p><div class="search"><input id="search" placeholder="Buscar nome, espécie, marca ou categoria..." value="${esc(q)}"></div></header><section class="section"><h2>Categorias</h2><div class="chips">${categories.map(c=>`<button class="chip ${cat===c?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div></section><section class="section"><h2>${a.length} itens publicados</h2><div class="grid">${a.map(card).join('')}</div>${!a.length?'<p>Nenhum item encontrado.</p>':''}</section><div class="notice"><strong>⚠ Informação importante:</strong> a página pública não exige login. Cosméticos são classificados como uso externo quando aplicável. Informações sobre plantas medicinais devem ser conferidas nas fontes oficiais e não equivalem automaticamente a comprovação de eficácia ou segurança.</div><footer style="text-align:center;padding:20px;color:#718078;font-size:12px">Guia Natural & Natura · catálogo público sem login</footer></div>`;document.getElementById('search').oninput=e=>{q=e.target.value;render();document.getElementById('search').focus()}}function detail(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;app.innerHTML=`<div class="wrap detail"><div class="detailTop"><button class="back" onclick="render()">← Voltar</button><button class="fav" onclick="toggle('${esc(p.id)}')">${favs.includes(p.id)?'★ Favorito':'☆ Favoritar'}</button></div><div class="detailHero">${p.imageUrl?`<img class="detailPhoto" src="${esc(p.imageUrl)}">`:`<div class="detailPhoto" style="display:grid;place-items:center;font-size:70px">🌿</div>`}<div><span class="badge">${esc(p.category)}</span><span class="badge">${esc(p.usageType)}</span><h1>${esc(p.name)}</h1>${p.popularName?`<p><strong>Nome popular:</strong> ${esc(p.popularName)}</p>`:''}${p.scientificName?`<p><strong>Nome científico:</strong> <i>${esc(p.scientificName)}</i></p>`:''}</div></div><div class="detailGrid"><div class="info"><h3>Finalidade</h3><p>${esc(p.purpose||'Não cadastrada')}</p></div><div class="info"><h3>Modo de uso</h3><p>${esc(p.usage||'Não cadastrado')}</p></div><div class="info"><h3>Uso / ingestão</h3><p>${esc(p.ingestion||p.usageType||'Não informado')}</p></div><div class="info"><h3>Alertas</h3><p>${esc(p.alerts||p.warnings||'Não cadastrados')}</p></div><div class="info"><h3>Contraindicações</h3><p>${esc(p.contraindications||'Não cadastradas')}</p></div><div class="info"><h3>Possíveis reações</h3><p>${esc(p.adverseReactions||'Não cadastradas')}</p></div></div><p style="margin-top:20px"><strong>Fonte:</strong> ${p.sourceUrl?`<a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">${esc(p.source||p.sourceUrl)}</a>`:esc(p.source||'Não informada')}</p><div class="notice">Consulte sempre a fonte oficial, o rótulo e, quando necessário, um profissional habilitado.</div></div>`}render();db.collection('products').where('status','==','published').get().then(s=>{const cloud=s.docs.map(d=>({id:d.id,...d.data()}));if(cloud.length){products=cloud;render()}}).catch(e=>console.warn(e));</script></body></html>
